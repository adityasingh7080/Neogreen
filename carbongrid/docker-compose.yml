services:
  db:
    image: postgis/postgis:16-3.4
    container_name: carbongrid-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carbongrid}
      POSTGRES_USER: ${POSTGRES_USER:-carbongrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carbongrid}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: carbongrid-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db

  ai_services:
    build: ./ai_services
    container_name: carbongrid-ai
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8001:8001"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: carbongrid-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
